<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Contact MNDe for inquiries about deterministic execution control."
    />
    <title>Contact | MNDe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/site.css" />
    <script defer src="assets/js/analytics.js"></script>
    <script defer src="assets/js/site.js"></script>
  </head>
  <body data-page="contact">
    <div class="site-shell">
      <header class="site-header" data-include="header"></header>
      <main class="page-main">
        <section class="page-hero">
          <div class="container reveal">
            <p class="eyebrow">Contact</p>
            <h1>Contact</h1>
            <p class="page-intro">For inquiries, reach out directly.</p>
            <p class="contact-direct"><a href="mailto:mndesystems@gmail.com">mndesystems@gmail.com</a></p>
          </div>
        </section>

        <section class="section">
          <div class="container contact-grid">
            <div class="contact-panel reveal">
              <h2>Direct</h2>
              <p>Email</p>
              <a class="inline-link" href="mailto:mndesystems@gmail.com">mndesystems@gmail.com</a>
            </div>
            <form class="contact-form reveal delay-1" id="contact-form">
              <label for="name">Name</label>
              <input id="name" name="name" type="text" required />

              <label for="email">Email</label>
              <input id="email" name="email" type="email" required />

              <label for="message">Message</label>
              <textarea id="message" name="message" rows="6" required></textarea>

              <button class="button button-primary" type="submit">Submit</button>
              <p class="form-note" id="form-note" aria-live="polite"></p>
            </form>
          </div>
        </section>
      </main>
      <footer class="site-footer" data-include="footer"></footer>
    </div>
  </body>
</html>
