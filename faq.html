              <h2>What does MNDe do</h2>
              <p>It enforces a decision before execution.</p>
            </article>

              <p>No. It evaluates execution requests, not network traffic.</p>
            </article>

              <h2>Can decisions be audited</h2>
              <p>Yes. Every decision is signed and replayable.</p>
